    <script>

        // smooth scroll + text animation code
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.addEventListener('beforeunload', () => {
            window.scrollTo(0, 0);
        });

        document.addEventListener('DOMContentLoaded', () => {
            const smoothScroll = (function () {
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

                const EASE = 0.07;
                const WHEEL_MULTIPLIER = 1;

                let current = window.scrollY;
                let target = window.scrollY;
                let rafId = null;
                let running = false;

                const getMaxScroll = () => document.documentElement.scrollHeight - window.innerHeight;

                function loop() {
                    current += (target - current) * EASE;
                    if (Math.abs(target - current) < 0.4) {
                        current = target;
                        window.scrollTo({ top: current, left: 0, behavior: 'instant' });
                        running = false;
                        return;
                    }
                    window.scrollTo({ top: current, left: 0, behavior: 'instant' });
                    rafId = requestAnimationFrame(loop);
                }

                function start() {
                    if (running) return;
                    running = true;
                    rafId = requestAnimationFrame(loop);
                }

                function onWheel(e) {
                    if (e.ctrlKey) return;
                    e.preventDefault();
                    target += e.deltaY * WHEEL_MULTIPLIER;
                    target = Math.max(0, Math.min(target, getMaxScroll()));
                    start();
                }

                function scrollTo(top) {
                    target = Math.max(0, Math.min(top, getMaxScroll()));
                    start();
                }

                if (!prefersReducedMotion && !isCoarsePointer) {
                    window.addEventListener('wheel', onWheel, { passive: false });

                    window.addEventListener('scroll', () => {
                        if (running) {
                            if (Math.abs(window.scrollY - current) > 10) {
                                cancelAnimationFrame(rafId);
                                running = false;
                                current = window.scrollY;
                                target = window.scrollY;
                            }
                            return;
                        }
                        current = window.scrollY;
                        target = window.scrollY;
                    }, { passive: true });

                    window.addEventListener('resize', () => {
                        target = Math.max(0, Math.min(target, getMaxScroll()));
                    });
                }

                return { scrollTo, enabled: !prefersReducedMotion && !isCoarsePointer };
            })();

            (function () {
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const anchorLinks = document.querySelectorAll('a[href^="#"]:not([href="#"])');

                anchorLinks.forEach((link) => {
                    link.addEventListener('click', (e) => {
                        const targetId = link.getAttribute('href');
                        const target = document.querySelector(targetId);
                        if (!target) return;

                        e.preventDefault();

                        if (smoothScroll.enabled) {
                            smoothScroll.scrollTo(0);
                        } else {
                            window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
                        }

                        if (history.pushState) {
                            history.pushState(null, '', targetId);
                        } else {
                            window.location.hash = targetId;
                        }
                    });
                });
            })();

            document.querySelectorAll('a[href="#"]').forEach((link) => {
                link.addEventListener('click', (e) => e.preventDefault());
            });

            const toggleBtn = document.querySelector('.mobile-toggle');
            const drawer = document.querySelector('.mobile-drawer');

            if (toggleBtn && drawer) {
                const drawerLinks = document.querySelectorAll('.mobile-drawer .navbar-link, .mobile-drawer .navbar-cta');

                const toggleMenu = () => {
                    toggleBtn.classList.toggle('open');
                    drawer.classList.toggle('open');
                    document.body.style.overflow = drawer.classList.contains('open') ? 'hidden' : '';
                };

                toggleBtn.addEventListener('click', toggleMenu);
                drawerLinks.forEach((link) => link.addEventListener('click', toggleMenu));
            }

            const imageWrapper = document.querySelector('.hero-image-wrapper');
            const imageContainer = document.querySelector('.hero-image-container');
            if (imageWrapper && imageContainer) {
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                if (prefersReducedMotion) {
                    imageContainer.classList.add('is-visible');
                } else {
                    setTimeout(() => imageContainer.classList.add('is-visible'), 600);
                }

                const MAX_PARALLAX_PX = 130;
                const PARALLAX_RATE = 0.22;
                let parallaxTicking = false;

                const applyParallax = () => {
                    parallaxTicking = false;
                    if (prefersReducedMotion || window.innerWidth < 1200) {
                        imageWrapper.style.transform = 'translate(-50%, 0)';
                        return;
                    }
                    const offset = Math.min(window.scrollY * PARALLAX_RATE, MAX_PARALLAX_PX);
                    imageWrapper.style.transform = `translate(-50%, ${offset}px)`;
                };

                const requestParallax = () => {
                    if (!parallaxTicking) {
                        parallaxTicking = true;
                        window.requestAnimationFrame(applyParallax);
                    }
                };

                window.addEventListener('scroll', requestParallax, { passive: true });
                window.addEventListener('resize', requestParallax);
                applyParallax();
            }
        });
    </script>
</body>

</html>
